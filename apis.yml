apis:
- aid: api-market:api-market-mcp-gateway
  name: API.market MCP Gateway
  description: 'Hosted remote MCP server (Streamable HTTP) that lets AI agents discover and call the APIs listed
    on API.market through five tools: search_apis, get_api_tools, call_api, check_usage and manage_subscription.
    Authenticates with OAuth 2.1 (authorization code + PKCE S256, dynamic client registration, scope mcp:use) or
    an x-api-market-key header.'
  humanURL: https://api.market/mcp
  baseURL: https://api.market/api/mcp/gateway
  tags:
  - MCP
  - AI Agents
  - OAuth
  - API Marketplace
  properties:
  - type: Documentation
    url: https://docs.api.market/api.market-mcp-server-guide
  - type: GitHubRepository
    url: https://github.com/Noveum/api-market-agent-integrations
  - type: MCPServer
    url: mcp/api-market-mcp.yml
- aid: api-market:api-market-subscription-management-api
  name: API.market Subscription Management API
  description: REST API for reading a marketplace product and its pricing plans, reading the caller's current subscription,
    creating/upgrading/downgrading a subscription to a pricing plan (with a dry-run option) and cancelling a subscription.
    Authenticated with the x-api-market-key header.
  humanURL: https://docs.api.market/subscription-management-api-documentation
  baseURL: https://api.market
  tags:
  - Subscriptions
  - Billing
  - API Marketplace
  properties:
  - type: Documentation
    url: https://docs.api.market/subscription-management-api-documentation
- aid: api-market:api-market-usage-api
  name: API.market Usage API
  description: Read-only REST API that returns quota, calls made and renewal dates for one subscription or for all
    of the caller's active subscriptions. Authenticated with the x-api-market-key header.
  humanURL: https://docs.api.market/api.market-usage-api-documentation
  baseURL: https://prod.api.market
  tags:
  - Usage Metering
  - Analytics
  - API Marketplace
  properties:
  - type: Documentation
    url: https://docs.api.market/api.market-usage-api-documentation
